spring.application.name=citaSalud-service

spring.datasource.url=jdbc:h2:mem:citasalud;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# research.md #1: decenas de solicitudes concurrentes esperadas por franja
# (plan.md Scale/Scope); el pool por defecto (10) es insuficiente para ese
# nivel de concurrencia sin encolar conexiones.
spring.datasource.hikari.maximum-pool-size=30

spring.h2.console.enabled=true
