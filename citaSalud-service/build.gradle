plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.16.0'
	id 'jacoco'
	id 'checkstyle'
}

group = 'org.ups'
version = '0.0.1-SNAPSHOT'
description = 'citaSalud-service'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-jdbc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// --- Principio IV: API-First con OpenAPI Generator ---
def generatedSourcesDir = "$buildDir/generated/openapi"

openApiGenerate {
	generatorName = 'spring'
	inputSpec = "$rootDir/openapi/citasalud-v1.yaml".toString()
	outputDir = generatedSourcesDir
	apiPackage = 'org.ups.citasalud.presentation.generated.api'
	modelPackage = 'org.ups.citasalud.presentation.generated.model'
	invokerPackage = 'org.ups.citasalud.presentation.generated.invoker'
	configOptions = [
		interfaceOnly        : 'true',
		useSpringBoot3       : 'true',
		skipDefaultInterface : 'true',
		documentationProvider: 'none',
		dateLibrary          : 'java8',
	]
}

sourceSets {
	main {
		java {
			srcDirs += "$generatedSourcesDir/src/main/java"
		}
	}
}

compileJava.dependsOn tasks.named('openApiGenerate')

// --- Principio VI: Quality Gates via JaCoCo ---
jacoco {
	toolVersion = '0.8.13'
}

def jacocoExcludes = [
	'org/ups/citasalud/CitaSaludServiceApplication*',
	'org/ups/citasalud/presentation/generated/**',
]

tasks.named('test') {
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	classDirectories.setFrom(
		files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		})
	)
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('test')
	classDirectories.setFrom(
		files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		})
	)
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				minimum = 0.80
			}
			limit {
				counter = 'BRANCH'
				minimum = 0.80
			}
		}
		rule {
			element = 'CLASS'
			excludes = jacocoExcludes
			limit {
				counter = 'LINE'
				minimum = 0.80
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}

// --- Principio VII: Static Analysis (Checkstyle, adaptado de google_checks.xml) ---
checkstyle {
	toolVersion = '10.20.2'
	configFile = file('config/checkstyle/checkstyle.xml')
	maxWarnings = 0
}

// El código generado por OpenAPI Generator no es código propio del equipo;
// Checkstyle sólo evalúa las fuentes escritas a mano en src/.
tasks.named('checkstyleMain') {
	source = fileTree(dir: 'src/main/java')
}
